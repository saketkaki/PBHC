# @package _global_

# Defense with counterattacks on uneven terrain (DEFENSE_MANEUVERS.md, Section 10): exp/defense_terrain.yaml, and after a
# blocked or evaded attack the defender performs a kung-fu clip (scripts/make_defense_counters.py) aimed at the attacker.
#
#   python scripts/make_defense_counters.py
#   python scripts/expand_checkpoint.py logs/Defense/<defense_terrain run>/model_<it>.pt \\
#       humanoidverse/config/obs/defense/main_terrain_counter.yaml logs/warmstart/defense_counter.pt \\
#       "env.config.terrain_aware.height_scan.y_range=[-0.5,0.5]"
#   python humanoidverse/train_agent.py +simulator=isaacgym +exp=defense_terrain_counter +opt=wandb +device=cuda:0 \\
#       headless=True seed=2 checkpoint=logs/warmstart/defense_counter.pt experiment_name=<name>

defaults:
  - defense
  - /terrain: terrain_kungfu
  - /robot: g1/g1_23dof_lock_wrist
  - /domain_rand: main
  - /rewards: defense/counter
  - /obs: defense/main_terrain_counter
  - _self_

project_name: Defense
experiment_name: defense_terrain_counter
num_envs: 4096

robot:
  motion:
    motion_file: g1_attack_dataset/PBHC_attacks/motion_data/attacks/defender_guard.pkl

env:
  config:
    terrain_aware:
      recenter_motion_xy: True # the guard on the centre of its tile, where the terrain features pass
      spawn_clearance: 0.01
      ground_relative_ref: True # the guard reference (and with it the attacker) stands on the local terrain
      height_scan:
        y_range: [-0.5, 0.5]
      height_lookup: exact
      ref_height_lookup: exact
      placement_jitter: 0.15 # [m] random xy shift of the guard per episode: each tile's features are met at many offsets
      early_start:
        prob: 0.0 # the guard has no opening move
      swing_clearance: True # a lifted reference foot of a counter clip clears a riser next to it
      support_lift_gain: 4
    max_episode_length_s: 30 # an attack and its counter take about 11 s
    defense:
      counter:
        enable: True
        clips: [horse_stance_punch, hooks_punch] # the kicks need the drift-cutoff curriculum below (LOG.md, Side kick)
    termination_scales:
      termination_motion_far_threshold: 0.7 # drift cutoff of the counter clips; the guard keeps counter.guard_far_threshold (0.6 m)
    # stage 2, with the kicks (a robot that cannot kick yet is cut off at every kick by a fixed 0.7 m cutoff):
    #   "env.config.defense.counter.clips=[horse_stance_punch,hooks_punch,side_kick,side_kick,roundhouse_kick,roundhouse_kick]"
    #   "++env.config.defense.counter.clip_far_threshold={horse_stance_punch:0.7,hooks_punch:0.7}"
    #   env.config.termination_curriculum.terminate_when_motion_far_curriculum=True
    #   env.config.termination_curriculum.terminate_when_motion_far_initial_threshold=1.5
    #   env.config.termination_curriculum.terminate_when_motion_far_threshold_min=0.7
    #   env.config.termination_curriculum.terminate_when_motion_far_curriculum_degree=1.5e-5

terrain:
  curriculum: True # defense rule (LeggedRobotDefense._update_terrain_curriculum): up after a survived episode, down after an early end
  num_cols: 24
  max_init_terrain_level: 1
  curriculum_graduate_rows: 2
  curriculum_max_difficulty_by_type: {step: 2.0, tilt: 1.75, bumps: 2.0} # top rows: 17 cm steps, 21 deg tilt, 8 cm bumps

algo:
  config:
    save_interval: 500
