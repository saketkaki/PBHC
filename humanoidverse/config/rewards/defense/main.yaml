# @package _global_

# Guard tracking (motion_tracking/main) as a style prior, plus the defense outcomes. Scales are multiplied by dt
# (0.02): an event term of -500 costs 10 once; all tracking terms together earn at most ~0.2 per step.

defaults:
  - /rewards/motion_tracking/main
  - _self_

rewards:
  reward_scales:
    feet_air_time: 0.0 # the guard reference never lifts a foot
    defense_hit: -500.0
    defense_block: 100.0
    defense_evade: 100.0
    defense_striker_proximity: -10.0
    defense_attacker_overlap: -20.0 # up to -0.8 per step with both forearms deep inside the attacker

  # smoothness penalties at full strength within ~580 iterations (motion_tracking/main: 0.10 and 1e-5, ~9,600 iterations,
  # so earlier defense fine-tunes trained them at 0.10-0.15), and a fine-tune continues at its checkpoint's scale (LOG.md, SMOOTH)
  reward_initial_penalty_scale: 0.25
  reward_penalty_degree: 0.0001
  reward_penalty_carry_over: True

  adaptive_tracking_sigma:
    enable: False # a static reference would shrink sigma until any defensive move loses all tracking reward
