# @package _global_

# Defense against a second G1 (see DEFENSE_MANEUVERS.md): motion tracking of a static guard
# (robot.motion.motion_file = .../defender_guard.pkl) while a kinematic attacker replays the attack dataset.

defaults:
  - motion_tracking

env:
  _target_: humanoidverse.envs.defense.defense.LeggedRobotDefense
  config:
    max_episode_length_s: 20 # about 10 attacks
    termination:
      terminate_when_motion_end: False # the guard is held past the end of its 2 s clip
    termination_scales:
      termination_motion_far_threshold: 0.6
    termination_curriculum:
      terminate_when_motion_far_curriculum: False

    defense:
      attack_file: g1_attack_dataset/PBHC_attacks/motion_data/attacks/attacks_all.pkl # file or directory of clips
      attacks: null # subset of attack names, e.g. [jab, cross]; null = all 8
      keypoints: [pelvis, head_link, left_elbow_link, right_elbow_link, left_hand_link, right_hand_link,
                  left_knee_link, right_knee_link, left_ankle_roll_link, right_ankle_roll_link]
      keypoint_history: # attacker_keypoints: newest first; obs_dims.attacker_keypoints = keypoints x 3 x length
        length: 10
        stride: 2 # control steps between frames (10 x 2 covers 0.36 s; a jab takes 0.14-0.2 s from onset to impact)
      placement_noise: # per clip, around the defender's root and heading at the clip start
        yaw_deg: 0.0
        range: 0.0 # [m] the attacker stands up to this much closer or farther
      standoff: 0.25 # [m] the attacker stands this much farther back in guard and steps in during the strike (onset to impact), so the guards don't touch before an attack
      blend_time: 0.25 # [s] ease the attacker's pose from the end of one clip into the next (clips start with >= 0.35 s of guard)
      hit_radius: 0.08 # [m] striker path to the target point (fist radius ~4 cm)
      block_radius: 0.07 # [m] striker path to a defender forearm axis (elbow to hand); 0 disables blocks
      threat_lead_time: 0.1 # [s] the threat window starts this long before the onset and ends at the recovered frame
      tracking_relax: 0.5 # guard-tracking rewards are scaled by (1 - tracking_relax) in the threat window
      proximity_sigma: 0.1 # [m] defense_striker_proximity reward
      tti_clip: 1.0 # [s] time to impact in attack_privileged
      terminate_on_hit: False
      outcome_log_decay: 0.999 # per step, for the logged hit / block / evade rates
      debug_draw: True # env 0 in the viewer: striker, target, aim point, outcome markers (and the attacker skeleton without attacker_actor)
      outcome_marker_time: 1.0 # [s] how long the viewer shows where the last attack ended
      blind_actor: none # none, or for evaluation: freeze (the actor sees the attacker held in its guard before each strike) or zero
      attacker_actor: auto # draw the attacker as a G1 (visual-only actors, no collision); auto = only with a viewer
      attacker_feet: # the attacker is a ghost without locomotion: keep its feet from sliding and floating
        planted: True # feet stay where they stand while the clip has them in contact; the legs shear between the pelvis
                      # (placed by the clip, `standoff` and the defender's position) and the feet; False = feet follow the clip
        step_trigger: 0.3 # [m] a planted foot farther than this from where the clip has it is re-planted with a step
        step_time: 0.3 # [s] duration of such a step
        step_lift: 0.05 # [m] foot lift during the step
        swing_decay: 0.08 # [s] a foot the clip lifts (calf kick) returns to the clip's path with this time constant
        crouch_max: 0.2 # [m] on terrain each foot stands on the ground under it; the upper body is lowered by at most this
        stretch_max: 0.05 # [m] or raised by at most this from the attacker's own ground to keep its strikes aimed at the defender
      counter: # counterattacks: after a blocked or evaded attack the defender performs a kung-fu clip aimed at the attacker
        enable: False
        clip_dir: g1_attack_dataset/PBHC_attacks/motion_data/attacks/defender_counters # scripts/make_defense_counters.py
        clips_all: [horse_stance_punch, hooks_punch, side_kick, roundhouse_kick] # order of the one-hot in `counter_command`
        clips: [horse_stance_punch, hooks_punch, side_kick, roundhouse_kick] # the clips in use (a subset, for a curriculum)
        prob: 0.7 # share of the defended attacks that are countered
        hit_radius: 0.17 # [m] the defender's striking hand or foot to the attacker's trunk axis (pelvis to head): the trunk's surface
        min_extension: 0.8 # the striker must also be this share of the clip's reach away from the defender's own root (a thrown strike)
        hit_window: 0.4 # [s] around the clip's strike time in which the strike can land
        proximity_sigma: 0.15 # [m] defense_counter_proximity reward
        max_aim_yaw_deg: 100.0 # the clip is turned about its start by at most this to point its strike at the attacker
        max_aim_shift: 0.4 # [m] and moved along the strike direction by at most this to reach it
        aim_depth: 0.13 # [m] the strike is aimed this far short of the attacker's trunk axis (on its surface, the bodies apart)
        leg_aim_depth: 0.06 # [m] the same for a strike at the attacker's leg (the calf kick)
        leg_hit_radius: 0.12 # [m]
        leg_reward_scale: 1.0 # defense_counter_hit and _proximity are multiplied by this for a strike at the leg
        leg_proximity_sigma: 0.3 # [m] wider than proximity_sigma: a kick that is not thrown yet starts far from the leg
        reanchor: 0.0 # [m] the reference stays stepped in until a counter ends, then the guard moves to the robot, at most this far (0: the robot steps back)
        reanchor_total: 1.0 # [m] at most this far from the guard's place at the episode start
        head_top: 0.1 # [m] the trunk axis ends this far above the head link's origin
        guard_far_threshold: 0.6 # [m] drift cutoff while holding the guard; termination_motion_far_threshold (and its
                                 # curriculum) then applies to the counter clips only. null = one cutoff for both
        clip_far_threshold: {} # per clip, a fixed drift cutoff [m] on top of the env's, e.g. {horse_stance_punch: 0.7}
